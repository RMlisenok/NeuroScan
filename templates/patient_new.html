{% extends "base.html" %}
{% block content %}
<h3 class="text-info mb-4">Новый пациент</h3>
<form method="post" class="row g-3">
    <div class="col-md-6">
        <label class="form-label">ФИО *</label>
        <input name="full_name" class="form-control bg-dark text-light border-secondary" required>
    </div>
    <div class="col-md-3">
        <label class="form-label">Дата рождения</label>
        <input type="date" name="birth_date" class="form-control bg-dark text-light border-secondary">
    </div>
    <div class="col-md-3">
        <label class="form-label">Пол</label>
        <select name="gender" class="form-select bg-dark text-light border-secondary">
            <option value="">—</option>
            <option>М</option>
            <option>Ж</option>
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Телефон</label>
        <input name="phone" class="form-control bg-dark text-light border-secondary">
    </div>
    <div class="col-md-4">
        <label class="form-label">Email</label>
        <input name="email" class="form-control bg-dark text-light border-secondary">
    </div>
    <div class="col-md-4">
        <label class="form-label">Полис ОМС</label>
        <input name="insurance_number" class="form-control bg-dark text-light border-secondary">
    </div>
    <div class="col-12">
        <label class="form-label">Адрес</label>
        <input name="address" class="form-control bg-dark text-light border-secondary">
    </div>
    <div class="col-12">
        <label class="form-label">Анамнез</label>
        <textarea name="anamnesis" rows="3" class="form-control bg-dark text-light border-secondary"></textarea>
    </div>
    <div class="col-12">
        <label class="form-label">Жалобы</label>
        <textarea name="complaints" rows="4" class="form-control bg-dark text-light border-secondary"
placeholder="Головная боль, тошнота, судороги, нарушения зрения/речи, слабость в конечностях..."></textarea>
    </div>
    <div class="col-12">
        <label class="form-label">Заметки врача</label>
        <textarea name="notes" rows="2" class="form-control bg-dark text-light border-secondary"></textarea>
    </div>
    <div class="col-12">
        <button class="btn btn-info fw-bold">Сохранить</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
