{% extends "base.html" %}
{% block content %}
<div class="ns-page-head">
    <h1 class="ns-page-title">Новый пациент</h1>
</div>

<form method="post" class="ns-card p-4">
    <div class="ns-section-title">Личные данные</div>
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <label class="form-label">ФИО *</label>
            <input name="full_name" class="form-control" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Дата рождения</label>
            <input type="date" name="birth_date" class="form-control">
        </div>
        <div class="col-md-3">
            <label class="form-label">Пол</label>
            <select name="gender" class="form-select">
                <option value="">—</option>
                <option>М</option>
                <option>Ж</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Полис</label>
            <input name="insurance_number" class="form-control">
        </div>
    </div>

    <div class="ns-section-title">Клинические данные</div>
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label">Жалобы</label>
            <textarea name="complaints" rows="4" class="form-control"
placeholder="Головная боль, тошнота, судороги, нарушения зрения/речи, слабость в конечностях..."></textarea>
        </div>
        <div class="col-12">
            <label class="form-label">Заметки врача</label>
            <textarea name="notes" rows="2" class="form-control"></textarea>
        </div>
    </div>

    <div class="d-flex gap-2 mt-4 pt-3 border-top">
        <button class="btn btn-brand">Сохранить</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">Отмена</a>
    </div>
</form>
{% endblock %}
