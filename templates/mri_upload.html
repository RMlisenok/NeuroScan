{% extends "base.html" %}
{% block content %}
<div class="ns-page-head">
    <div>
        <h1 class="ns-page-title">Загрузка МРТ</h1>
        <div class="ns-page-sub">Пациент: <b>{{ patient.full_name }}</b></div>
    </div>
</div>

<form method="post" enctype="multipart/form-data" class="ns-card p-4">
    <div class="ns-section-title">Снимки</div>
    <p class="ns-page-sub mb-3">Можно загрузить от 1 до {{ max_images }} снимков.</p>

    <input type="file" name="files" multiple accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff"
           class="form-control mb-3" required>

    <div class="form-text mb-4">
        Принимаются PNG, JPG, BMP, TIFF. Каждый снимок пройдёт контроль качества.
    </div>

    <button class="btn btn-brand">Загрузить и проанализировать</button>
</form>
{% endblock %}
