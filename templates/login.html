{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="ns-card p-4 p-md-5">
            <h3 class="ns-page-title mb-1">Вход в систему</h3>
            <p class="ns-page-sub mb-4">Укажите логин и ключ доступа</p>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input name="username" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Ключ доступа</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button class="btn btn-brand w-100">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
