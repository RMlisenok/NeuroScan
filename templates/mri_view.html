{% extends "base.html" %}
{% block title %}МРТ #{{ mri.id }} — NeuroScan AI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="ns-card p-4">
            <h1 class="ns-page-title mb-4">Снимок МРТ #{{ mri.id }}</h1>

            <img src="{{ url_for('uploaded_file', filename=mri.file_path) }}"
                 alt="МРТ" class="img-fluid rounded mb-4" style="max-width: 500px;">

            <div class="ns-section-title">Результат анализа</div>
            <p class="mb-1"><b>Класс:</b> {{ predicted_class }}</p>
            <p class="mb-0"><b>Уверенность:</b> {{ confidence }}%</p>
        </div>
    </div>
</div>
{% endblock %}
