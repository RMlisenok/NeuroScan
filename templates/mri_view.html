<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>МРТ #{{ mri.id }} — NeuroScan AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container py-5" style="max-width: 720px;">
    <div class="ns-card p-4">
        <h1 class="ns-page-title mb-4">Снимок МРТ #{{ mri.id }}</h1>

        <img src="{{ url_for('uploaded_file', filename=mri.file_path) }}"
             alt="МРТ" class="ns-img mb-4" style="max-width: 500px;">

        <h2 class="ns-section-title">Результат анализа</h2>
        <p class="mb-1"><b>Класс:</b> {{ predicted_class }}</p>
        <p class="mb-0"><b>Уверенность:</b>
            <span style="color: var(--ns-brand-dark);">{{ confidence }}%</span>
        </p>
    </div>
</div>
</body>
</html>
